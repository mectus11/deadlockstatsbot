name: Build and publish Docker image

# Builds the bot's Docker image and pushes it to GitHub Container Registry (ghcr.io) every
# time you push to main, so the OVH panel can always pull ghcr.io/<you>/<repo>:latest.
on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger a rebuild by hand from the Actions tab

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
